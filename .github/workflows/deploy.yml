name: Build Native iOS App

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          pip install --upgrade pip
          pip install kivy-ios Cython

      - name: Initialize toolchain and build Kivy
        run: |
          toolchain build python3 kivy

      - name: Create Xcode Project
        run: |
          toolchain create jbrcade ./src

      - name: Build iOS App Package
        run: |
          xcodebuild -project jbrcade-ios/jbrcade.xcodeproj \
            -scheme jbrcade \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$(PWD)/jbrcade-ios/build"

      - name: Zip iOS Output
        run: |
          cd jbrcade-ios/build/Release-iphoneos
          zip -r JBRCADE-iOS.zip jbrcade.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JBRCADE-iOS-App
          path: jbrcade-ios/build/Release-iphoneos/JBRCADE-iOS.zip